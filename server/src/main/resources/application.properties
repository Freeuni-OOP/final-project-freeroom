server.port=${PORT:8080}

# The connection looks for environment variables on each of our PC
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres?reWriteBatchedInserts=true
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Limit Hikari connection pool size for Supabase free tier limits
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

supabase.service.key=${SUPABASE_SERVICE_ROLE_KEY:dummy_key_for_ci_build}
supabase.project.ref=lahucjwdhglaxwdkiroz

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# keep false in production
app.dev.mock-time.enabled=false
app.dev.mock-time.datetime=2026-06-02T15:30:00
